<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>멀티모달 챗봇</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-top">
          <button id="newChatBtn" class="primary">+ 새 대화</button>
          <button id="settingsBtn">⚙️ 설정</button>
          <label class="field-label">모델 선택</label>
          <select id="modelSelect">
            <option value="gpt-4o-mini">gpt-4o-mini</option>
            <option value="gpt-4.1-mini">gpt-4.1-mini</option>
            <option value="gpt-4.1">gpt-4.1</option>
          </select>
          <label class="field-label">검색 모드</label>
          <select id="searchMode">
            <option value="standard">표준 검색</option>
            <option value="deep">심층 검색</option>
          </select>
        </div>

        <div id="chatList" class="chat-list"></div>
      </aside>

      <main class="main">
        <header class="main-header">
          <h1>멀티모달 챗봇</h1>
          <span id="llmStatus">상태: 대기 중</span>
        </header>

        <section id="chat"></section>

        <form id="chatForm">
          <div class="attach-row">
            <input id="fileInput" type="file" multiple />
            <div id="attachInfo">첨부 파일 없음</div>
          </div>
          <div class="input-row">
            <textarea id="message" placeholder="무엇이든 물어보세요"></textarea>
            <button type="submit" class="primary">전송</button>
          </div>
        </form>
      </main>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
